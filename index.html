<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4e">
  <meta name="description" content="從基礎技巧、學派理解到策略應用，為諮商初學者與跨領域學習者整理的閱讀與筆記空間。">
  <title>聽見｜諮商學習資料庫</title>
  <style>
    /* 【跟生成式AI 協作完成的】我把版型固定在這裡，新增教材只更新資料區。 */
    :root{--paper:#f7f5ef;--surface:#ffffff;--ink:#263d36;--muted:#65716b;--green:#315c4e;--sage:#e7eee6;--sand:#efe8dc;--line:#d9dfd5;--rust:#8a513a;--max:1120px;--radius:18px;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:120px}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button,a,input,textarea{touch-action:manipulation}
    button,a{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    button{color:inherit}
    svg{flex-shrink:0}
    a,button,input,textarea{outline-offset:5px}
    a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #a56837}
    button:disabled{cursor:default;opacity:.55}
    ::selection{background:#d8e4d5}
    p{margin:0 0 1em}
    h1,h2,h3,h4{line-height:1.5;margin:0;color:var(--ink)}
    h1,h2{font-family:var(--serif);font-weight:600}
    h3{font-weight:600}
    ul,ol{padding-left:1.4em}
    img,svg{max-width:100%}
    [hidden]{display:none!important}
    .wrap{width:min(var(--max),calc(100% - 64px));margin-inline:auto}
    .muted{color:var(--muted)}
    .small{font-size:13px}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--green);text-transform:uppercase}
    .skip-link{position:fixed;left:20px;top:-100px;background:var(--ink);color:white;padding:10px 20px;z-index:100}
    .skip-link:focus{top:12px}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .icon{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .site-header{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .header-inner{min-height:88px;display:flex;align-items:center;gap:34px}
    .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
    .brand-mark{width:36px;height:42px;color:var(--green)}
    .brand-title{font-family:var(--serif);font-size:25px;letter-spacing:.12em;line-height:1.3}
    .brand-sub{display:block;font-size:10px;color:var(--muted);letter-spacing:.18em;margin-top:2px}
    .primary-nav{display:flex;align-items:center;gap:25px;margin-left:auto}
    .primary-nav a{font-size:14px;white-space:nowrap;position:relative;padding:31px 0}
    .primary-nav a::after{content:"";height:2px;position:absolute;bottom:19px;left:0;right:0;background:var(--green);transform:scaleX(0);transition:transform .18s}
    .primary-nav a:hover::after,.primary-nav a[aria-current="page"]::after{transform:scaleX(1)}
    .header-tools{display:flex;align-items:center;gap:16px;white-space:nowrap}
    .tool-link{display:flex;align-items:center;gap:6px;font-size:13px}
    .note-count{background:var(--sage);font-size:11px;min-width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
    .header-divider{height:24px;width:1px;background:var(--line)}
    main{min-height:65vh}
    main:focus{outline:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 19px;border:1px solid var(--green);border-radius:6px;font-size:14px;font-weight:500;line-height:1.65;background:var(--green);color:white;transition:background .15s,transform .15s;text-align:center}
    .btn:hover{background:#244b3f;transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:var(--green);border-color:var(--line)}
    .btn-secondary:hover{background:var(--sage)}
    .btn-small{padding:7px 12px;font-size:13px}
    .text-link{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-size:14px}
    .text-link:hover{text-decoration:underline;text-underline-offset:5px}
    .icon-button{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--green)}
    .icon-button:hover,.icon-button[aria-pressed="true"]{background:var(--sage)}
    .icon-button[aria-pressed="true"] .icon{fill:var(--green);stroke:var(--green)}
    .hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:35px;padding:64px 0 48px}
    .hero h1{font-size:clamp(38px,4.3vw,54px);letter-spacing:.07em;line-height:1.45;margin:17px 0 22px}
    .hero h1 em{font-style:normal;position:relative;white-space:nowrap}
    .hero h1 em::after{content:"";position:absolute;left:0;right:4px;bottom:3px;height:8px;background:#d4dec8;z-index:-1}
    .hero-copy>p{max-width:435px;color:var(--muted);font-size:16px;line-height:1.95}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:27px}
    .hero-caption{font-size:12px!important;margin-top:18px!important;letter-spacing:.05em}
    .hero-art{position:relative;padding:8px 10px 0}
    .hero-art>svg{width:100%;display:block;max-height:380px}
    .art-caption{position:absolute;bottom:12px;right:20px;font-family:var(--serif);font-size:13px;letter-spacing:.15em;color:var(--green)}
    .search-band{display:flex;align-items:center;gap:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:21px 0}
    .search-band>p{font-size:13px;flex-shrink:0;margin:0;color:var(--muted)}
    .search-form{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
    .search-form input{border:0;background:transparent;color:var(--ink);width:100%;min-width:0;padding:7px 0;font-size:15px}
    .search-form input::placeholder{color:#6e7872}
    .search-form button{border:0;background:transparent;color:var(--green);padding:7px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
    .section{padding:48px 0 6px}
    .section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:25px}
    .section-heading h2{font-size:28px;letter-spacing:.05em}
    .section-heading p{font-size:14px;color:var(--muted);margin:5px 0 0}
    .topics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .topic-card{border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;min-height:243px;display:flex;flex-direction:column;background:rgba(255,255,255,.4);transition:transform .18s,border-color .18s}
    .topic-card:hover{transform:translateY(-4px);border-color:#8da38e}
    .topic-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topic-number{font-family:var(--serif);font-size:27px;color:#768b73;line-height:1}
    .topic-card h3{font-family:var(--serif);font-size:22px;margin-bottom:7px}
    .topic-card p{font-size:13px;color:var(--muted);line-height:1.85;margin-bottom:20px}
    .topic-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--green)}
    .topic-card:nth-child(1){background:#e9eee4}
    .topic-card:nth-child(2){background:#f0ebe0}
    .topic-card:nth-child(3){background:#edeedb}
    .topic-card:nth-child(4){background:#e9eee9}
    .reading-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .reading-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s}
    .reading-card:hover{border-color:#8da38e}
    .card-main{padding:24px 24px 12px;display:block;flex:1}
    .card-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:12px}
    .pill{display:inline-flex;gap:5px;align-items:center;border-radius:4px;background:var(--sage);padding:2px 8px;font-size:11px;color:var(--green)}
    .reading-card h3{font-family:var(--serif);font-size:22px;line-height:1.65;margin-bottom:12px}
    .reading-card p{font-size:13px;color:var(--muted);line-height:1.9;margin:0}
    .card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 23px 19px;gap:12px;font-size:12px;color:var(--green)}
    .card-footer .icon-button{width:32px;height:32px}
    .starter-num{font-family:var(--serif);font-size:27px;color:#8c9d84}
    .quote-band{margin-top:48px;border-radius:var(--radius);padding:30px 36px;background:var(--sage);display:flex;align-items:center;justify-content:space-between;gap:28px}
    .quote-band h2{font-size:22px;margin:5px 0 8px}
    .quote-band p{font-size:14px;color:var(--muted);margin:0;max-width:640px}
    .quote-band>.icon{width:48px;height:48px;stroke-width:1;color:#678164}
    .news-list{border-top:1px solid var(--line)}
    .news-row{display:grid;grid-template-columns:130px 1fr 32px;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:23px 0}
    .news-row:hover h3{text-decoration:underline;text-underline-offset:5px}
    .news-row time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
    .news-row h3{font-size:17px;margin:3px 0 5px;font-weight:500}
    .news-row p{font-size:13px;color:var(--muted);margin:0}
    .continue-strip{margin-top:30px;padding:15px 20px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:7px;display:flex;justify-content:space-between;gap:15px;align-items:center}
    .continue-strip small{color:var(--muted);display:block}
    .continue-strip strong{font-size:14px;font-weight:500}
    .page-head{padding:47px 0 27px}
    .breadcrumbs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:22px}
    .breadcrumbs a:hover{text-decoration:underline}
    .page-head h1{font-size:38px;letter-spacing:.05em;margin-top:9px}
    .page-head .intro{max-width:710px;font-size:15px;color:var(--muted);margin:14px 0 0}
    .category-summary{display:flex;align-items:center;gap:14px;margin:22px 0 0;font-size:13px;color:var(--muted)}
    .progress-track{height:5px;width:100px;background:var(--line);border-radius:8px;overflow:hidden}
    .progress-track span{display:block;background:var(--green);height:100%}
    .list-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px;border-bottom:1px solid var(--line);padding-bottom:17px}
    .filter-group{display:flex;gap:7px;flex-wrap:wrap}
    .filter{border:1px solid transparent;background:transparent;border-radius:5px;padding:6px 12px;font-size:13px;color:var(--muted)}
    .filter[aria-pressed="true"]{background:var(--green);color:white}
    .filter:hover{border-color:var(--line)}
    .lesson-list{display:grid;gap:12px}
    .lesson-row{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
    .lesson-main{display:grid;grid-template-columns:52px 1fr 68px;gap:16px;align-items:center;flex:1;min-width:0;padding:22px 22px 23px}
    .lesson-number{font-family:var(--serif);font-size:25px;color:#778c75;align-self:start;padding-top:5px}
    .lesson-main h2{font-family:var(--sans);font-size:18px;margin:3px 0 7px;font-weight:500;line-height:1.7}
    .lesson-main p{font-size:13px;margin:0;color:var(--muted)}
    .lesson-time{font-size:12px;white-space:nowrap;color:var(--muted)}
    .lesson-row>.icon-button{margin-right:20px;flex-shrink:0}
    .lesson-row:hover{border-color:#93a58b}
    .tag-line{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
    .article-head{max-width:800px}
    .article-head h1{font-size:36px;line-height:1.6;letter-spacing:.025em;margin:12px 0 16px;overflow-wrap:anywhere}
    .article-head .article-summary{font-size:16px;color:var(--muted);line-height:1.9;max-width:710px}
    .article-meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--muted);font-size:12px;margin:17px 0 0}
    .article-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:50px;align-items:start;margin-top:18px}
    .article-body{min-width:0;font-size:16px;line-height:2}
    .learning-goals{padding:22px 26px;background:var(--sage);border-radius:12px;margin-bottom:32px}
    .learning-goals h2{font-size:18px;font-family:var(--sans);margin-bottom:9px}
    .learning-goals ul{font-size:14px;margin:0}
    .article-section{padding-top:10px;margin-bottom:27px}
    .article-section h2{font-size:23px;margin-bottom:16px;display:flex;gap:12px;align-items:baseline}
    .section-index{font-family:var(--sans);font-size:11px;color:#75876d;font-weight:500;letter-spacing:.05em}
    .article-section p:last-child{margin-bottom:0}
    .article-section ul{margin:8px 0}
    .article-section li{padding-left:3px;margin:5px 0}
    .example-box{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:32px 0}
    .box-heading{padding:18px 24px;background:#f1ede3;border-bottom:1px solid var(--line)}
    .box-heading h2{font-size:21px}
    .box-heading p{font-size:12px;color:var(--muted);margin:4px 0 0}
    .example-body{padding:23px}
    .client-line{font-family:var(--serif);font-size:18px;padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
    .response-block+.response-block{margin-top:18px}
    .response-block .response-label{font-size:12px;font-weight:500;color:var(--muted)}
    .response-block p{font-size:15px;margin:7px 0}
    .response-block.better{border-left:3px solid #7a9471;padding:5px 17px;background:#f1f5ed}
    .response-explanation{font-size:13px!important;color:var(--muted);margin-top:16px!important}
    .practice-box{padding:25px;background:var(--sand);border-radius:12px;margin:32px 0}
    .practice-box h2{font-size:22px;margin:8px 0 12px}
    .practice-box p{font-size:15px}
    .practice-box ul{font-size:13px;color:var(--muted);margin-bottom:18px}
    .ml-box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin:30px 0}
    .ml-box h2{font-size:15px;font-family:var(--sans);display:flex;align-items:center;gap:8px;margin-bottom:9px}
    .ml-box p{font-size:13px;color:var(--muted);margin:0}
    .sources{font-size:13px;margin:28px 0}
    .sources summary{cursor:pointer;color:var(--green);padding:13px 0;font-weight:500}
    .sources ol{padding-left:20px}
    .sources a{color:var(--green);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
    .sources li{margin-bottom:10px}
    .collaboration-note{font-size:12px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:15px}
    .article-nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:30px;padding-top:23px;gap:25px}
    .article-nav a{font-size:14px;color:var(--green)}
    .article-nav a:last-child{text-align:right}
    .article-nav small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
    .sidebar{position:sticky;top:113px}
    .note-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:21px}
    .note-panel h2{font-family:var(--serif);font-size:20px;display:flex;align-items:center;gap:9px}
    .note-panel>p{font-size:12px;color:var(--muted);margin:8px 0 16px;line-height:1.8}
    .note-input{display:block;width:100%;min-height:205px;resize:vertical;border:1px solid var(--line);background:#fdfcf8;color:var(--ink);border-radius:8px;padding:13px;font-size:14px;line-height:1.9}
    .note-input::placeholder{color:#768075}
    .note-status{font-size:11px;color:var(--muted);min-height:21px;margin:8px 0 12px;display:flex;gap:6px;align-items:center}
    .note-status.error{color:#98462c}
    .panel-actions{display:flex;gap:8px;flex-wrap:wrap}
    .panel-actions .btn{flex:1;font-size:12px;padding:8px 9px;white-space:nowrap}
    .local-note{font-size:11px!important;color:var(--muted);line-height:1.75;margin:16px 0 0!important}
    .toc{padding:23px 7px 0}
    .toc h2{font-size:12px;font-family:var(--sans);color:var(--muted);font-weight:500;margin-bottom:10px}
    .toc button{display:block;border:0;background:transparent;text-align:left;font-size:12px;color:var(--muted);padding:6px 0;line-height:1.7;width:100%}
    .toc button:hover{color:var(--green);text-decoration:underline;text-underline-offset:4px}
    .related-section{margin-top:38px}
    .related-section h2{font-size:22px;margin-bottom:13px}
    .related-links{display:flex;gap:10px;flex-wrap:wrap}
    .related-links a{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:var(--surface);color:var(--green)}
    .related-links a:hover{background:var(--sage)}
    .empty-state{background:var(--surface);border:1px dashed #b9c5b3;border-radius:var(--radius);padding:48px 24px;text-align:center;margin:20px 0}
    .empty-state>.icon{width:35px;height:35px;color:#7f9479;margin-bottom:15px}
    .empty-state h2{font-size:22px;margin-bottom:11px}
    .empty-state p{font-size:14px;color:var(--muted);max-width:500px;margin:0 auto 20px}
    .search-page-form{max-width:800px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 18px;margin:7px 0 27px}
    .search-suggestions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
    .search-suggestions a{font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:20px}
    .notes-toolbar{padding:21px 24px;background:var(--sage);border-radius:12px;margin-bottom:25px;display:flex;justify-content:space-between;gap:18px;align-items:center}
    .notes-toolbar p{font-size:13px;color:var(--muted);margin:0;max-width:440px}
    .export-actions{display:flex;gap:8px;flex-wrap:wrap}
    .note-list{display:grid;gap:20px}
    .saved-note{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .saved-note-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}
    .saved-note h2{font-size:21px;margin-top:5px}
    .saved-note h2 a:hover{text-decoration:underline;text-underline-offset:5px}
    .saved-note .note-input{min-height:130px}
    .saved-note .note-status{margin-bottom:0}
    .saved-list{margin-top:35px}
    .storage-warning{margin:18px auto 0;padding:13px 18px;background:#f5e9db;color:#7f432c;border:1px solid #d4b698;border-radius:8px;font-size:13px}
    .import-result{font-size:13px;padding:17px 20px;border-left:3px solid var(--green);background:var(--surface);white-space:pre-line;margin-bottom:20px}
    .site-footer{margin-top:70px;padding:35px 0 28px;border-top:1px solid var(--line)}
    .footer-inner{display:flex;justify-content:space-between;gap:35px;align-items:flex-start}
    .footer-brand{font-family:var(--serif);font-size:19px;letter-spacing:.1em}
    .footer-copy{font-size:12px;color:var(--muted);max-width:490px;margin:8px 0 0}
    .footer-meta{font-size:11px;color:var(--muted);text-align:right;line-height:2}
    .footer-meta a:hover{text-decoration:underline}
    .toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,16px);background:var(--ink);color:#fff;border-radius:8px;padding:12px 20px;font-size:13px;max-width:calc(100% - 36px);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
    .toast.visible{opacity:1;transform:translate(-50%,0)}
    .no-script{padding:40px;background:var(--sand)}
    
    @media(min-width:1440px){.hero{padding-top:78px;padding-bottom:58px}
    }
    
    @media(max-width:1060px){.header-inner{gap:22px}
    .primary-nav{gap:16px}
    .header-tools{gap:11px}
    .article-layout{gap:30px;grid-template-columns:minmax(0,1fr) 270px}
    .hero h1{font-size:43px}
    .topic-card{padding:20px 17px}
    .reading-card h3{font-size:20px}
    }
    
    @media(max-width:900px){.header-inner{flex-wrap:wrap;padding-top:14px;gap:0;min-height:0}
    .brand{margin-right:auto}

    window.StudyNotebook = (() => {
      'use strict';
      const APP = 'tingjian-studyroom';
      const validId = id => typeof id === 'string' && /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/.test(id) && !['constructor','prototype'].includes(id);
      const plain = value => value !== null && typeof value === 'object' && !Array.isArray(value);

      function validate(value) {
        if (!plain(value) || value.schemaVersion !== 1 || value.app !== APP || !plain(value.notes)) throw new Error('這不是聽見的第 1 版筆記備份。');
        if (Object.keys(value.notes).length > 2000) throw new Error('備份筆記數量過多。');
        const result = empty();
        for (const [id, note] of Object.entries(value.notes)) {
          if (!validId(id) || !plain(note) || typeof note.text !== 'string' || note.text.length > 50000 || typeof note.updated !== 'string' || !/^\d{4}-\d{2}-\d{2}T/.test(note.updated) || !Number.isFinite(Date.parse(note.updated))) throw new Error('備份含有格式不正確的筆記。');
          result.notes[id] = {text:note.text, updated:note.updated};
        }
        for (const key of ['read','saved']) {
          if (!Array.isArray(value[key]) || value[key].length > 2000 || value[key].some(id => !validId(id))) throw new Error('備份的閱讀或收藏清單格式不正確。');
          result[key] = [...new Set(value[key])];
        }
        if (value.lastRead !== null && !validId(value.lastRead)) throw new Error('備份的閱讀位置格式不正確。');
        result.lastRead = value.lastRead;
        return result;
      }
      function merge(current, incoming) {
        const result = validate(current), other = validate(incoming), conflicts = [];
        let added = 0;
        for (const [id, note] of Object.entries(other.notes)) {
          const existing = result.notes[id];
          if (existing && existing.text.trim() && existing.text !== note.text) { conflicts.push(id); continue; }
          if (!existing || existing.text !== note.text) { result.notes[id] = {...note}; added++; }
        }
        result.read = [...new Set([...result.read,...other.read])];
        result.saved = [...new Set([...result.saved,...other.saved])];
        if (!result.lastRead) result.lastRead = other.lastRead;
        return {state:validate(result), added, conflicts};
      }
      return {empty, validate, merge};
    })();

        const notes = Object.entries(state.notes).filter(([,n])=>n.text.trim()).sort((a,b)=>b[1].updated.localeCompare(a[1].updated));
        const saved = state.saved.map(id=>byId.get(id)).filter(Boolean);
        return '<div class="page-head">'+crumbs()+'<div class="eyebrow">My learning notebook</div><h1>把理解，慢慢寫成自己的話</h1><p class="intro">這裡收好你的閱讀筆記與收藏。沒有進度競賽，只有一次比一次更清楚的理解。</p></div><section class="notes-toolbar" aria-label="備份筆記"><p>筆記只存在目前瀏覽器，不會自動跨裝置同步。<br>JSON 可以備份及還原；Markdown 適合留存、整理與分享。</p><div class="export-actions"><button class="btn btn-secondary btn-small" data-action="export-json">'+icon('download')+'JSON 備份</button><button class="btn btn-secondary btn-small" data-action="import">匯入筆記</button><button class="btn btn-secondary btn-small" data-action="export-md">匯出 Markdown</button></div></section>'+(importMessage?'<div class="import-result" role="status">'+e(importMessage)+'</div>':'')+'<div class="section-heading"><h2>我的筆記 <span class="small muted">'+notes.length+' 篇</span></h2></div>'+(notes.length?'<div class="note-list">'+notes.map(([id,n],i)=>{const a=byId.get(id);return '<section class="saved-note"><div class="saved-note-header"><div><span class="eyebrow">'+(a?e(categories.get(a.category).title):'保留的舊筆記')+'</span><h2>'+(a?'<a href="'+articleLink(a)+'">'+e(a.title)+'</a>':e(id))+'</h2></div>'+(a?'<a class="text-link" href="'+articleLink(a)+'">回到文章 '+icon('arrow')+'</a>':'')+'</div><label class="sr-only" for="saved-note-'+i+'">'+e(a?.title||id)+'的筆記</label><textarea class="note-input" id="saved-note-'+i+'" data-note="'+e(id)+'" maxlength="50000">'+e(n.text)+'</textarea><div class="note-status" data-note-status="'+e(id)+'" aria-live="polite"></div></section>';}).join('')+'</div>':emptyState('第一篇筆記，從一個小問題開始','在文章旁寫下想法，筆記就會整理到這裡。收藏的文章也會保留在下方。','挑一篇開始閱讀','#category/basics'))+'<section class="saved-list"><div class="section-heading"><h2>留著，之後再讀 <span class="small muted">'+saved.length+' 篇</span></h2></div>'+(saved.length?'<div class="lesson-list">'+saved.map((a,i)=>lessonRow(a,i+1)).join('')+'</div>':'<p class="small muted">點選文章上的書籤，就可以把想讀的教材放在這裡。</p>')+'</section>';
      }
      function notFound() { return '<div class="page-head"><div class="eyebrow">Let’s find another path</div><h1>這一頁暫時找不到</h1></div>'+emptyState('換一條閱讀路徑','原有筆記仍然保留。你可以回首頁，從四個主題重新選擇。','回到首頁','#home'); }
      function getRoute() {
        const pieces=location.hash.replace(/^#/,'').split('/');
        let value=''; try { value=decodeURIComponent(pieces.slice(1).join('/')); } catch { return {type:'missing'}; }
        return {type:pieces[0]||'home',value};
      }
      function render({keepScroll=false,focusMain=false}={}) {
        const y=window.scrollY, route=getRoute();
        if (route.type!==currentRoute.type || route.value!==currentRoute.value) currentFilter='all';
        currentRoute=route;
        let title='';
        if(route.type==='home'){main.innerHTML=home();}
        else if(route.type==='category'){main.innerHTML=categoryPage(route.value);title=categories.get(route.value)?.title||'找不到頁面';}
        else if(route.type==='article'){main.innerHTML=articlePage(route.value);const a=byId.get(route.value);title=a?.title||'找不到頁面';if(a){state.lastRead=a.id;persist();}}
        else if(route.type==='search'){main.innerHTML=searchPage(route.value||'');title='搜尋教材';}
        else if(route.type==='notes'){main.innerHTML=notesPage();title='我的筆記';}
        else {main.innerHTML=notFound();title='找不到頁面';}
        document.title=(title?title+'｜':'')+DATA.site.title;
        const active=route.type==='category'?route.value:route.type==='article'?byId.get(route.value)?.category:null;
        document.querySelectorAll('[data-category-nav]').forEach(link=>{if(link.dataset.categoryNav===active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});
        updateStorageUI();
        if (focusMain) main.focus({preventScroll:true});
        window.scrollTo({top:keepScroll?y:0,behavior:'instant'});
      }
      function download(name,text,type) {
        const url=URL.createObjectURL(new Blob([text],{type}));
        const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
      }
      function backup() {return {...state, exportedAt:new Date().toISOString()};}
      function exportMarkdown() {
        const lines=['# 聽見｜我的閱讀筆記','','匯出時間：'+new Date().toLocaleString('zh-TW'),''];
        const notes=Object.entries(state.notes).filter(([,n])=>n.text.trim());
        if(!notes.length)lines.push('目前還沒有筆記。','');
        for(const [id,n]of notes){const a=byId.get(id);lines.push('## '+(a?.title||id),'','文章識別碼：'+id,'','最後編輯：'+n.updated,'',...n.text.split('\n').map(line=>'> '+line),'');}
        lines.push('## 已讀文章','',...state.read.map(id=>'- '+(byId.get(id)?.title||id)),'','## 收藏文章','',...state.saved.map(id=>'- '+(byId.get(id)?.title||id)),'');
        download('聽見-閱讀筆記-'+new Date().toISOString().slice(0,10)+'.md',lines.join('\n'),'text/markdown;charset=utf-8');
      }
      document.getElementById('primary-nav').innerHTML=DATA.categories.map(cat=>'<a href="#category/'+e(cat.id)+'" data-category-nav="'+e(cat.id)+'">'+e(cat.title)+'</a>').join('');
      document.addEventListener('submit',event=>{
        if(!event.target.matches('[data-search-form]'))return;
        event.preventDefault();const query=new FormData(event.target).get('q').trim().slice(0,120);const hash='#search/'+encodeURIComponent(query);
        if(location.hash===hash)render({focusMain:true});else location.hash=hash;
      });
      document.addEventListener('input',event=>{
        const field=event.target;if(!field.matches('[data-note]'))return;
        state.notes[field.dataset.note]={text:field.value,updated:new Date().toISOString()};persist();
      });
      document.addEventListener('click',event=>{
        const button=event.target.closest('[data-action],[data-filter],[data-scroll],[data-reset-filter],#skip-main');
        if(!button)return;
        if(button.id==='skip-main'){event.preventDefault();main.focus();return;}
        if(button.hasAttribute('data-reset-filter')){currentFilter='all';if(button.getAttribute('href')===location.hash){event.preventDefault();render({focusMain:true});}return;}
        if(button.dataset.scroll){document.getElementById(button.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}
        if(button.dataset.filter){currentFilter=button.dataset.filter;render({keepScroll:true});document.querySelector('[data-filter="'+currentFilter+'"]')?.focus({preventScroll:true});return;}
        const action=button.dataset.action,id=button.dataset.id;
        if(action==='focus-note'){const note=document.getElementById('article-note');note?.scrollIntoView({block:'center',behavior:'instant'});note?.focus({preventScroll:true});}
        if(action==='save'||action==='read'){
          const key=action==='save'?'saved':'read',has=state[key].includes(id);
          state[key]=has?state[key].filter(item=>item!==id):[...state[key],id];
          const ok=persist();render({keepScroll:true});
          document.querySelector('[data-action="'+action+'"][data-id="'+id+'"]')?.focus({preventScroll:true});
          toast((has?(action==='save'?'已取消收藏':'已取消已讀標記'):(action==='save'?'已加入收藏':'已標記已讀'))+(ok?'':'（目前暫存於此頁）'));
        }
        if(action==='export-json')download('聽見-筆記備份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(backup(),null,2),'application/json;charset=utf-8');
        if(action==='export-md')exportMarkdown();
        if(action==='import')document.getElementById('import-file').click();
      });
      document.getElementById('import-file').addEventListener('change',async event=>{
        const file=event.target.files[0];if(!file)return;
        try {
          if(file.size>5*1024*1024)throw new Error('備份檔請小於 5 MB。');
          const merged=Core.merge(state,JSON.parse(await file.text()));state=merged.state;const ok=persist();
          importMessage='已匯入 '+merged.added+' 篇筆記，並合併已讀與收藏清單。'+(merged.conflicts.length?'\n以下 '+merged.conflicts.length+' 篇內容不同，已保留原有筆記，沒有覆寫：'+merged.conflicts.map(id=>byId.get(id)?.title||id).join('、'):'\n沒有覆蓋任何不同內容的舊筆記。')+(ok?'':'\n目前尚未儲存到瀏覽器，請立即匯出合併後的備份。');
        } catch(error) {importMessage='沒有匯入：'+(error instanceof SyntaxError?'檔案不是有效的 JSON 備份。':error.message);}
        event.target.value='';
        if(location.hash==='#notes')render({keepScroll:true});else location.hash='#notes';
      });
      window.addEventListener('hashchange',()=>render({focusMain:true}));
      window.addEventListener('beforeunload',event=>{if(storageFailed&&noteCount()){event.preventDefault();event.returnValue='';}});
      loadState();render();
    })();
  </script>
</body>
</html>
